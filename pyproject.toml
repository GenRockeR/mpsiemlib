[project]
name = "mpsiemlib"
version = "1.7.0"
description = "MaxPatrol SIEM API SDK"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [
    { name = "nikolaiav" },
    { name = "GenRockeR" },
]
maintainers = [
    { name = "GenRockeR" },
]
dependencies = [
    "requests (>=2.32.3,<3.0.0)",
    "setuptools (>=83.0.0,<85.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "urllib3 (>=1.26.20,<3.0.0)",
    "lxml (>=6.1.0,<7.0.0)",
    "certifi (>=2026.1.4,<2027.0)",
]

[project.optional-dependencies]
# Модуль Events работает напрямую с Elasticsearch (elasticsearch-клиент).
# На стендах со storage Logspace не требуется - ставится отдельно:
#   pip install "mpsiemlib[events]"
events = [
    "elasticsearch (>=7.17.12,<7.18.0)",
]

[project.urls]
Homepage = "https://pypi.org/project/mpsiemlib/"
Repository = "https://github.com/GenRockeR/mpsiemlib"

[tool.poetry]
include = ["CHANGELOG.md"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.4,<3.0)",
    "faker (>=40.1.0,<41.0.0)",
    "types-pyyaml (>=6.0.12,<7.0.0)",
    "types-pytz (>=2025.2.0.20251108)",
    "types-setuptools (>=80.9.0.20251223)",
]
docs = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings (>=1.0.6,<2.0.0)",
    "mkdocstrings-python (>=2.0.9,<3.0.0)",
    # mkdocstrings импортирует модуль Events при генерации документации
    "elasticsearch (>=7.17.12,<7.18.0)",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ['.venv', 'examples', 'tests']

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true